OC1103.seijo_exp = 業績が良好であり、かつ、財務内容にも特段問題無いと認められる取引先
OC1103.yochui_exp = 業況が低調ないし不安定な取引先または財務内容に問題がある取引先など今後の管理に厳重注意が必要な取引先
OC1103.kashitaore_exp = 経営破綻の状態には至っていないが、債務の弁済に重大な問題が生じているか又は生じる可能性が高い取引先
OC1103.kashitaore_exp1 = 業況が低調ないし不安定、債務超過若しくは実質的に債務超過の状態にあり、過去の経営成績又は経営改善計画の実現性を考慮しても債務の一部を条件通りに弁済できない可能性が高い
OC1103.kashitaore_exp2 = 取引先に対して弁済期間の延長、弁済の一時棚上げ、元金又は利息の一部免除を行っている等、弁済条件の大幅な緩和を行っている
OC1103.kashitaore_exp3 = 債務の弁済がおおむね1年以上延滞している
OC1103.hasan_kosei_exp = 経営破綻又は実質的に経営破綻に陥っている取引先
