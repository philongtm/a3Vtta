OC1103.exp = Check any of the following.
OC1103.seijo_exp = The customers who have good financial standing and are deemed to have no specific financial problems.
OC1103.yochui_exp = The customers who have poor or unstable business results or have financial problems and, therefore, need greater caution in future management.
OC1103.kashitaore_exp = The customers who are not yet bankrupt but have or are likely to have serious problems in repaying their debts and may be classified as follows:
OC1103.kashitaore_exp1 = The customer's business performance is poor or unstable or a customer is insolvent, in effect, and there is a high possibility that the customer is unable to repay part of the debts under the pre-determined conditions in view of past business performance or management improvement plan.
OC1103.kashitaore_exp2 = The terms of repayment for a debtor are significantly relaxed, such as extension of repayment period, temporary suspension of repayment, and exemption from repayment of part of the principal or interest.
OC1103.kashitaore_exp3 = The customer's repayment of debts is in arrears for one year or longer.
OC1103.hasan_kosei_exp = The customers who are bankrupt or bankrupt in effect and may be classified as follows:
OC1103.hasan_kosei_exp1 = The customers are legally or formally undergoing bankruptcy
OC1103.hasan_kosei_exp2 = Liquidation
OC1103.hasan_kosei_exp3 = Corporate<br>Rearrangement / Reorganization
