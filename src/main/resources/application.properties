#\u3000	\u3000\u3000	SID				TEST
#   	    PORT				1521
#		\u306e\u5834\u5408\u3001
#			\u63a5\u7d9a\u5148\uff35\uff32\uff2c\u3000jdbc:oracle:thin:@127.0.0.1:1521:TEST
#
#	\u30ad\u30fc \uff1a\u30eb\u30fc\u30c8\u30c7\u30a3\u30ec\u30af\u30c8\u30ea\uff0e\uff35\uff32\uff2c\u3000 \u672a\u5b9a\u7fa9\u306e\u5834\u5408\u306f\u30c7\u30d5\u30a9\u30eb\u30c8(db.URL)\u3092\u4f7f\u7528\u3059\u308b\u3002
