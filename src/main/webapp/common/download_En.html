<META HTTP-EQUIV="content-type" CONTENT="text/html;charset=SHIFT_JIS">
<HTML>
<HEAD>
<TITLE>Language Of List</TITLE>
<link rel="stylesheet" href="../css/CommonStyle.css" type="text/css">
<link rel="stylesheet" href="../css/ime_mode_ja.css" type="text/css">
<script language="javascript">
var errMsg;
var itemName;
var aryElements = new Object();
var numElements = 0;
function onKeydown(no) {
	rc = true;
	e = window.event;
	if(blockKeyDown(e)==false) {
		return false;
	}
	if( (e.keyCode == 13) || (e.keyCode == 9) ) {
		if(e.shiftKey) {
			if(no <= 0) no=numElements;
			no--;
		} else {
			if((no+1) >= numElements) no=-1;
			no++;
		}
		if(aryElements[no].type!="hidden"){
			if(aryElements[no].disabled || aryElements[no].readOnly) {
				onKeydown(no);
			} else {
				aryElements[no].focus();
			}
		}
		rc = false;
	}
	e.cancelBubble = true;
	return rc;
}
function onBlur(no,col1,col2) {
	e = window.event;
	if(e.srcElement.name.search(/T/) == 0) {
		val = e.srcElement.value;
		e.srcElement.value = val; 
		if (isNaN(val)) {
		} else {
			if (col1 > 0) {
				e.srcElement.value = insertComma2(val,col2);
			}
		}
	}
}
function onFocus(no,sel) {
	if(sel == 1) {
		aryElements[no].select();
	}
}
function onFocusColorChange(no,sel,rowNo) {
    obj = document.all.item('header',rowNo);
    obj.style.backgroundColor='#FFCC99';
	if(sel == 1) {
		aryElements[no].select();
	}
}
document.onclick=shiftKeyCancel;
function shiftKeyCancel() {
	if (window.event.shiftKey) {
		return false;
	}
}
function registElement( elementName, arrayFlg, fildSel, rowNo) {
	obj = document.getElementById(elementName);
	if(obj==null){
		alert("registElement\n要素が見つかりません。\n\n" + elementName);
		return;
	}
	if(arrayFlg==0) {
		if (rowNo == undefined || rowNo == null) {
			obj.onfocus = new Function("","onFocus("+numElements+","+fildSel+");");
			obj.onkeydown = new Function("","return onKeydown("+numElements+");");
			aryElements[numElements] = obj;
			numElements++;
		} else {
			obj.onfocus = new Function("","onFocusColorChange("+numElements+","+fildSel+","+rowNo+");");
			obj.onkeydown = new Function("","return onKeydown("+numElements+");");
			aryElements[numElements] = obj;
			numElements++;
		}
	} else {
		obj = document.getElementsByName(elementName);
		for(i=0;i<obj.length;i++){
			obj2 = obj[i];
			obj2.onkeydown = new Function("","return onKeydown("+numElements+");");
			aryElements[numElements] = obj2;
			numElements++;
		}
	}
}
</script>
<script>
	function doSubmitNonLangMode(event) {
		form = document.forms[0];
		for(i = 0; i < form.searchMode.length; i++) {
			if(form.searchMode[i].checked){
				langKbn = form.searchMode[i].value;
			}
		}
		formOya = window.opener.document.forms[0];
		action = formOya.action;
		formOya.action += "?event=" + event + langKbn;
		formOya.submit();
	}
</script>
</HEAD>
<body>
<CENTER>
<DIV id="contents">
<br>
<H1 class="title01">Language Of List</H1>
<DIV id="list">
<FORM>
	<TABLE style="width=60%;text-align: center;" height="70px" class="none" border=0 cellSpacing=0 cellPadding=0>
		<TR>
			<TD>
				<DIV class="leftbox" style="float: left;">
					<input type="radio" name="searchMode" value="1" checked="checked"><span style="margin-top:3px;">Japanese&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
					<input type="radio" name="searchMode"  value="2"><span style="margin-top:3px;">English&nbsp;</span>
				</DIV>
			</TD>
		</TR>
	</TABLE>
	<DIV id="submenu" class="semaku">
		<input type="button" value="OK" onclick="doSubmitNonLangMode('download');window.close();">
		<input type="button" value="Close" onclick="javascript:window.close();">
	</DIV>
</FORM>
</DIV>
</DIV>
</CENTER>
</BODY>
</HTML>
