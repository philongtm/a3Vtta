<script>
		
function loadFinished()
{
try{
var timeOver = 0; 
if(boolFinished == true)
{
		var stepFrameStyle;

		if((isAutoDemonstration() && (stepFramePositionInAutoDemonstration == "None"))||
			
			(isOperationLecture() && (stepFramePositionInOperationLecture == "None"))||isPractice()||isOperationExercise())
		{
			stepFrameStyle = " src = \"stepContainer.htm\" scrolling=\"auto\" noresize=\"true\" ";
		}
		else
		{
			stepFrameStyle = " src = \"stepContainer.htm\" scrolling=\"auto\"";
		}
		document.writeln("<frameset id=\"parentFrame\" "+frameStructure+"  >");
		document.writeln("<frame id=\"contentFrame\" scrolling=\"auto\" src="+activePageURL+"  >");
		document.writeln("<frame id=\"stepFrame\""+stepFrameStyle+">");
		
		if(!isIE){
			window.captureEvents(Event.RESIZE);
			window.onresize = nsRefresh;
		}
}
else
{
   timeOver++;
   if(timeOver<30)
   {
       setTimeout("loadFinished()",1000);
   }
   else
   {
   	alert("time out ,net connected problem ,check your network please.");
   }
}
}
catch(e)
{}
}
loadFinished();
</script>
