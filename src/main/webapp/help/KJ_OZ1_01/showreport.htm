<script language="javascript">


var TestInfo = window.dialogArguments;
var UILanguage = TestInfo.UILanguage;
</script>
<script language="JavaScript">

var ButtonTag = 0;
window.returnValue = "Finish";
function Finish()
{
   if(TestInfo.SendReport>0)
   {
       ButtonTag = 0;
       if(confirm("レポートを提出せずにウィンドウを閉じようとしています。\nウィンドウを閉じると今回の結果は破棄されます。\nよろしいですか？"))
       {
           ButtonTag = 1;
	        window.returnValue = "Finish";
	        window.close();
	        return;
       }
       else
       {
        return;
       }
   }
   else
   {
	    window.returnValue = "Finish";
	    window.close();
	    return;
   }
}

function Restart()
{
   if(TestInfo.SendReport>0)
   {
       ButtonTag = 0;
      if(confirm("レポートを提出せずにウィンドウを閉じようとしています。\nウィンドウを閉じると今回の結果は破棄されます。\nよろしいですか？"))
      {
           ButtonTag = 1;
   	    window.returnValue = "Restart";
   	    window.close();
   	    return;
      }
      else
      {
          return;
      }
   }
   else
   {
	    window.returnValue = "Restart";
	    window.close();
	    return;
   }
}
function CloseReport()
{
   if(TestInfo.SendReport>0 && ButtonTag == 0)
   {
      window.event.returnValue = "レポートを提出せずにウィンドウを閉じようとしています。\nウィンドウを閉じると今回の結果は破棄されます。\nよろしいですか？";
   }
   else
   {
   }
}
function SendReport()
{
   window.returnValue = "SendReport";
   window.close();
   return;
}
</script>
</head>

		document.title = 'テストレポート';

<td width="100%">

<script language="javascript">

var LessonName=TestInfo.strLessonName.replace(" ","")==""?"&nbsp;":TestInfo.strLessonName;
var Author= TestInfo.strAuthor.replace(" ","")==""?"&nbsp;":TestInfo.strAuthor;
var CorrectStepCount=0;         //正解数
var IncorrectStepCount=0;       //不正解数
var Percentage = 0;             //得点
var WhetherPassed=false         // whether 合格
var Passed;                 // whether 合格
for (var i=0; i < TestInfo.Details.length; i++)
{
   if(TestInfo.Details[i][5]==true)
       {
            if(TestInfo.Details[i][2]==true)
               {
                    CorrectStepCount++;
               }
            else  
               {
                   IncorrectStepCount++;
               }
        }
}
if(CorrectStepCount!=0||IncorrectStepCount!=0)
{
   Percentage=parseInt((CorrectStepCount*100*100)/(CorrectStepCount+IncorrectStepCount))/100;
}
try
{
   if(Percentage>=parseInt(TestInfo.RequiredPercentage.substring(0,TestInfo.RequiredPercentage.length-1)))
       {
            Passed='合格'; //passed
        }
    else  
        {
             Passed='不合格'; //failed
        }
}
catch(e)
{
    Passed='不合格'; //failed
}
 TestInfo.CorrectSteps = CorrectStepCount;
 TestInfo.IncorrectSteps = IncorrectStepCount;
 TestInfo.Percentage = Percentage;
 TestInfo.Passed = Passed;
var strHTML=  "  <table  lang = 'ja'  border=\"1\" width=\"100%\" bordercolor=\"#808080\" bordercolordark=\"#808080\" bordercolorlight=\"#C0C0C0\"  style=\"table-layout:fixed\">" + 
					"    <tr>" + 
					"      <td width=\"30%\">レッスン名</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" +LessonName  +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">作者</td>" + 
"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top><font face = \"ＭＳ ゴシック\">"  + Author +" </font>" +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">日付</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + TestInfo.strDate +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">実施時間</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + TestInfo.TotalTime +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">設問数</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + parseInt(CorrectStepCount+IncorrectStepCount) +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">正解数</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + CorrectStepCount +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">不正解数</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + IncorrectStepCount +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">得点</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + Percentage +"点"+
					"      </td>" + 
					"    </tr>";
			if (parseInt(TestInfo.RequiredPercentage)>0)
				strHTML += 
					"    <tr>" + 
					"      <td width=\"30%\">合格ライン</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + TestInfo.RequiredPercentage +
					"      </td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\">判定</td>" + 
					"      <td width=\"70%\" colspan=\"2\" style='word-break:break-all' valign=top>" + Passed +
					"      </td>" + 
					"    </tr>";
				strHTML +=
					"    <tr>" + 
					"      <td width=\"100%\" colspan=\"3\"></td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"100%\" colspan=\"3\" align=\"center\"> 詳細</td>" + 
					"    </tr>" + 
					"    <tr>" + 
					"      <td width=\"30%\" align=\"center\">ステップID</td>" + 
					"      <td width=\"30%\" align=\"center\">試行数</td>" + 
					"      <td width=\"40%\" align=\"center\">判定</td>" + 
					"    </tr>";
	
	var strDetails = "";
	for (var i=0; i < TestInfo.Details.length; i++)
	{
		if (TestInfo.Details[i][4] != "")
			strDetails += "<tr>" + 
					"      <td width=\"30%\" align=\"center\">" + TestInfo.Details[i][4] + "</td>" + 
					"      <td width=\"30%\" align=\"center\">" + ((TestInfo.Details[i][5]==true) ?(TestInfo.Details[i][6]==true) ? '-' : TestInfo.Details[i][3]:'-') + "</td>" + 
					"      <td width=\"40%\" align=\"center\">" + ((TestInfo.Details[i][5]==true) ?(TestInfo.Details[i][2]==true?'正解':'不正解'): '-') + "</td>" + 
					"    </tr>";

	}
	strHTML += strDetails +"</table>";

	document.write(strHTML);
</script>
